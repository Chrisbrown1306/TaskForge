# Only TaskForge API and worker pods may talk to Redis.
# Note: NetworkPolicy is only enforced if the cluster's CNI supports it; a plain local kind
# cluster may accept the object without enforcing it. It is still the correct production config.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-taskforge-only
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: redis}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: taskforge}
      ports:
        - {protocol: TCP, port: 6379}
