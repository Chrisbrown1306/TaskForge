apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: taskforge}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: taskforge}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472   # "grafana" user in the official image
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: grafana/grafana:11.6.0
          ports:
            - {name: web, containerPort: 3000}
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD   # created by up.ps1, never stored in git
              valueFrom:
                secretKeyRef: {name: grafana-admin, key: password}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
          readinessProbe:
            httpGet: {path: /api/health, port: web}
          livenessProbe:
            httpGet: {path: /api/health, port: web}
            initialDelaySeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: datasource, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: grafana-datasource.yaml}
            - {name: provider, mountPath: /etc/grafana/provisioning/dashboards/provider.yaml, subPath: grafana-dashboards.yaml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - name: datasource
          configMap: {name: grafana-datasource}
        - name: provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboards
          configMap: {name: grafana-dashboards}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: {app.kubernetes.io/name: grafana}
spec:
  selector: {app.kubernetes.io/name: grafana}
  ports:
    - {name: web, port: 3000, targetPort: web}
